services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kisan
      POSTGRES_USER: kisan_app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisan_app -d kisan"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://kisan_app:${DB_PASSWORD}@db:5432/kisan
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: