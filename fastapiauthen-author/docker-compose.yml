services:
  api:
    build: .
    container_name: fastapi-learning-app
    ports:
      - "8002:8000"
    environment:
      - SECRET_KEY=dev-secret-key-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - DATABASE_URL=sqlite:///./test.db
    volumes:
      - app-data:/app/data
    restart: unless-stopped

volumes:
  app-data: